name: Spark Examples E2E Test

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["1.32.0"]

    steps:
      - name: Free disk space (Ubuntu runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install project and test deps
        run: |
          uv sync --extra spark
          uv pip install pytest pytest-timeout

      - name: Install Kind, kubectl, and Helm
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64" && chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -Lo ./kubectl "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin/kubectl
          curl -sSfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Checkout spark-operator
        uses: actions/checkout@v6
        with:
          repository: kubeflow/spark-operator
          path: spark-operator
          fetch-depth: 1

      - name: Build Spark Operator image
        run: |
          docker build -t ghcr.io/kubeflow/spark-operator/controller:local ./spark-operator
        timeout-minutes: 10

      - name: Setup Kind cluster with Spark Operator
        run: |
          make test-e2e-setup-cluster K8S_VERSION=${{ matrix.kubernetes-version }}
        env:
          SPARK_TEST_CLUSTER: spark-test
          SPARK_TEST_NAMESPACE: spark-test
          SPARK_OPERATOR_IMAGE_TAG: local
        timeout-minutes: 15

      - name: Build and load Spark E2E runner image (in-cluster)
        run: |
          docker build -f hack/Dockerfile.spark-e2e-runner -t spark-e2e-runner:local .
          kind load docker-image spark-e2e-runner:local --name spark-test
        timeout-minutes: 5

      - name: Run batch lifecycle example only
        env:
          SPARK_TEST_CLUSTER: spark-test
          SPARK_TEST_NAMESPACE: spark-test
          SPARK_E2E_DEBUG: "1"
          SPARK_E2E_RUN_IN_CLUSTER: "1"
          SPARK_E2E_RUNNER_IMAGE: spark-e2e-runner:local
        run: uv run pytest test/e2e/spark/test_spark_examples.py -k batch_job_lifecycle -v -s --tb=long
        timeout-minutes: 8

      - name: Debug environment
        run: |
          echo "SPARK_TEST_CLUSTER=$SPARK_TEST_CLUSTER"
          echo "SPARK_TEST_NAMESPACE=$SPARK_TEST_NAMESPACE"
          echo "SPARK_E2E_RUN_IN_CLUSTER=$SPARK_E2E_RUN_IN_CLUSTER"
        env:
          SPARK_TEST_CLUSTER: spark-test
          SPARK_TEST_NAMESPACE: spark-test
          SPARK_E2E_RUN_IN_CLUSTER: "1"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=================================================================="
          echo "Pods"
          echo "=================================================================="
          kubectl get pods -A -o wide || true

          echo
          echo "=================================================================="
          echo "Runner Job Pods"
          echo "=================================================================="
          kubectl get pods -n spark-test -l job-name=spark-e2e-batch-job-lifecycle -o wide || true

          for pod in $(kubectl get pods -n spark-test -l job-name=spark-e2e-batch-job-lifecycle -o jsonpath='{.items[*].metadata.name}'); do
            echo
            echo "=================================================================="
            echo "Runner Pod: $pod"
            echo "=================================================================="

            echo "--- Describe ---"
            kubectl describe pod "$pod" -n spark-test || true

            echo
            echo "--- Logs ---"
            kubectl logs "$pod" -n spark-test --all-containers=true || true

            echo
            echo "--- Previous Logs ---"
            kubectl logs "$pod" -n spark-test --previous --all-containers=true || true
          done

          echo
          echo "=================================================================="
          echo "SparkApplications"
          echo "=================================================================="
          kubectl get sparkapplications -A -o wide || true

          echo
          echo "=================================================================="
          echo "SparkApplication YAML"
          echo "=================================================================="
          for app in $(kubectl get sparkapplications -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{" "}{end}'); do
            ns="${app%/*}"
            name="${app#*/}"

            echo
            echo "===== $ns/$name ====="
            kubectl get sparkapplication "$name" -n "$ns" -o yaml || true

            echo
            echo "----- Describe -----"
            kubectl describe sparkapplication "$name" -n "$ns" || true
          done

          echo
          echo "=================================================================="
          echo "SparkConnect"
          echo "=================================================================="
          kubectl get sparkconnect -A || true

          echo
          echo "=================================================================="
          echo "PVCs"
          echo "=================================================================="
          kubectl get pvc -A || true

          echo
          echo "=================================================================="
          echo "Events"
          echo "=================================================================="
          kubectl get events -A --sort-by=.lastTimestamp || true

          echo
          echo "=================================================================="
          echo "Spark Operator Pods"
          echo "=================================================================="
          kubectl get pods -n spark-operator -o wide || true

          echo
          echo "=================================================================="
          echo "Spark Operator Logs"
          echo "=================================================================="
          for pod in $(kubectl get pods -n spark-operator -o jsonpath='{.items[*].metadata.name}'); do
            echo
            echo "===== $pod ====="
            kubectl logs -n spark-operator "$pod" --tail=500 || true
          done

          echo
          echo "=================================================================="
          echo "Spark Driver Pods"
          echo "=================================================================="
          kubectl get pods -n spark-test -l spark-role=driver -o wide || true

          for pod in $(kubectl get pods -n spark-test -l spark-role=driver -o jsonpath='{.items[*].metadata.name}'); do
            echo
            echo "===== Driver: $pod ====="

            echo
            echo "--- Describe ---"
            kubectl describe pod "$pod" -n spark-test || true

            echo
            echo "--- Logs ---"
            kubectl logs "$pod" -n spark-test --all-containers=true --tail=500 || true
          done
